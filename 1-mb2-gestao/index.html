<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>MB2 Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: menu lateral fixo + área de trabalho. Concreto frio como base; laranja de segurança só em ação e destaque; verde/âmbar/vermelho reservados para status. */
:root{
  --bg:#e9ebe8; --surface:#ffffff; --sunk:#f1f2ef; --ink:#191d1b; --muted:#59605c; --line:#d3d7d2; --side:#1b1f1d; --side-ink:#e7eae8; --side-muted:#9aa29e;
  --accent:#e2611b; --accent-ink:#ffffff; --accent-soft:#fbe6d9;
  --green:#1f8a4c; --green-soft:#dff1e5; --amber:#b77905; --amber-soft:#f8ecd2; --red:#c8352a; --red-soft:#f9e1de;
  --f-display:'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --surface:#1c201e; --sunk:#232826; --ink:#ebeeec; --muted:#9ba39f; --line:#323836; --side:#0f1211; --side-ink:#e7eae8; --side-muted:#8b938f;
  --accent:#ff8a47; --accent-ink:#1a0d04; --accent-soft:#3a2416;
  --green:#4ccb82; --green-soft:#183324; --amber:#f2b33d; --amber-soft:#382a10; --red:#ff7a6e; --red-soft:#3c1d1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1c201e; --sunk:#232826; --ink:#ebeeec; --muted:#9ba39f; --line:#323836; --side:#0f1211; --side-ink:#e7eae8; --side-muted:#8b938f;
  --accent:#ff8a47; --accent-ink:#1a0d04; --accent-soft:#3a2416;
  --green:#4ccb82; --green-soft:#183324; --amber:#f2b33d; --amber-soft:#382a10; --red:#ff7a6e; --red-soft:#3c1d1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.tab-num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--side) 232px,var(--bg) 232px)}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.logo{display:grid;gap:2px;padding:0 8px}
.logo b{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:-.02em;line-height:1}
.logo b span{color:var(--accent)}
.logo small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--side-ink);border-radius:10px;padding:10px 10px;font-weight:600;font-size:15px;text-align:left;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px}
.sidefoot{margin-top:auto;display:grid;gap:8px;padding:0 8px;font-size:12px;color:var(--side-muted)}
.sidefoot button{border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--side-ink);border-radius:8px;padding:7px 10px;font-size:13px;justify-self:start}

.main{min-width:0;padding-inline:24px;padding-block:22px 60px;display:grid;gap:18px;align-content:start;grid-template-columns:minmax(0,1fr)}
.main>*{min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.ph h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--muted)}
.badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}

.ls{display:none}
.mobile-only{display:none}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;overflow:visible;border-top:1px solid rgba(255,255,255,.08)}
  .logo,.sidefoot{display:none}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;gap:0}
  .nav button{flex-direction:column;gap:3px;padding:7px 2px;font-size:11px;font-weight:600;justify-content:center;align-items:center;position:relative;border-radius:10px;white-space:nowrap;overflow:hidden}
  .nav button svg{display:block;width:21px;height:21px}
  .nav button[aria-current="page"]{box-shadow:none;background:rgba(255,255,255,.1);color:#fff}
  .nav .lf{display:none}.ls{display:block}
  .nav .cnt{position:absolute;top:3px;left:calc(50% + 6px);margin:0;padding:0 5px;font-size:10px;line-height:16px}
  .main{padding-inline:16px;padding-block:18px 96px}
  .mobile-only{display:inline-block;justify-self:start}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}

/* ---------- blocos ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
@media (max-width:520px){.kpi{padding:12px}.kpi b{font-size:20px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.warn{border-color:var(--red)}.kpi.warn b{color:var(--red)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.box h2,.box h4{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.boxhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.boxhead h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
.empty{color:var(--muted);font-size:14px;margin:0}
.note{font-size:12px;color:var(--muted);margin:0}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:8px 14px}
.primary:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.g{color:var(--green);background:var(--green-soft)}.pill.y{color:var(--amber);background:var(--amber-soft)}.pill.r{color:var(--red);background:var(--red-soft)}
.pill.o{color:var(--accent);background:var(--accent-soft)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--sunk);border-radius:5px;padding:1px 6px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.g{background:var(--green)}.dot.y{background:var(--amber)}.dot.r{background:var(--red)}

/* tabelas */
.tw{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12px;color:var(--muted)}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--red)}

/* alertas */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.alerts li.r{background:var(--red-soft)}.alerts li.y{background:var(--amber-soft)}
.alerts li span{font-size:14px}
.alerts li b{font-weight:600}

/* gráfico */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent);fill-opacity:.12}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .res{stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4}
.chart .reslbl{font-family:var(--f-mono);font-size:11px;fill:var(--red)}
.chart .minpt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .minlbl{font-family:var(--f-body);font-size:12px;font-weight:600;fill:var(--ink)}
.chart .cross{stroke:var(--ink);stroke-width:1;opacity:0}
.chart .hpt{fill:var(--accent);stroke:var(--surface);stroke-width:2;opacity:0}
.chart.on .cross,.chart.on .hpt{opacity:1}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;max-width:240px;opacity:0;transform:translate(-50%,-110%);white-space:normal;z-index:2}
.chart.on .tip{opacity:1}
.tip b{font-size:14px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}

/* barras de vendas */
.sbars{display:grid;gap:12px}
.sbar{display:grid;gap:4px}
.sbar .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sbar .top b{font-weight:600}
.sbar .bar{display:flex;gap:2px;height:14px}
.sbar .bar i{display:block;height:100%;border-radius:3px;min-width:4px}
.s-v{background:var(--ink)}.s-r{background:var(--amber)}.s-d{background:var(--line)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:50;width:min(92vw,460px)}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);display:flex;gap:10px;align-items:flex-start}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}

/* ---------- obras (escritório) ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.subtabs{display:none;gap:4px;background:var(--sunk);border:1px solid var(--line);padding:4px;border-radius:12px;justify-self:start}
.subtabs button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
@media (max-width:1280px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .subtabs{display:flex}
  .stage[data-sub="office"] .fieldcol{display:none}
  .stage[data-sub="field"] .office{display:none}
}
.office{display:grid;gap:16px;min-width:0}
.tally{display:flex;gap:14px;font-size:14px;color:var(--muted);flex-wrap:wrap;align-items:center}
.tally span{display:inline-flex;align-items:center;gap:6px}
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.ocards.compact{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.oc{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:10px;position:relative;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.oc::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.oc[data-st="g"]{--c:var(--green);--cs:var(--green-soft)}.oc[data-st="y"]{--c:var(--amber);--cs:var(--amber-soft)}.oc[data-st="r"]{--c:var(--red);--cs:var(--red-soft)}
.oc[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.oc.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.oc h3{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15}
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c);background:var(--cs);border-radius:6px;padding:2px 8px;justify-self:start}
.meter{position:relative;height:10px;background:var(--sunk);border-radius:99px;border:1px solid var(--line)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--ink)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv strong{color:var(--ink);font-weight:600}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons span{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--sunk);color:var(--muted)}
.reasons span.r{background:var(--red-soft);color:var(--red)}.reasons span.y{background:var(--amber-soft);color:var(--amber)}
.upd{font-size:12px;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.detail{grid-template-columns:minmax(0,1fr)}}
.stages{display:grid;gap:8px}
.stg{display:grid;grid-template-columns:100px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.stg .bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.stg .bar i{display:block;height:100%;background:var(--ink)}
.stg .pct{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.stg.cur{font-weight:600}.stg.cur .bar i{background:var(--accent)}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.money div{display:grid;gap:2px;align-content:start}
.money span{font-size:12px;color:var(--muted)}
.money b{font-family:var(--f-display);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.money .over{color:var(--red)}.money .ok{color:var(--green)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{font-size:14px;display:flex;gap:8px;align-items:flex-start}
.list li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--amber);margin-top:6px}
.list.plain li::before{background:var(--line)}
.diary{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.diary li{display:grid;gap:4px;padding-left:14px;border-left:2px solid var(--line)}
.diary li.new{border-left-color:var(--accent)}
.diary .when{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.diary .what{font-size:14px}
.diary .ext{display:flex;flex-wrap:wrap;gap:6px}
.assist{border-color:var(--accent)}
.nudge{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.nudge:first-of-type{border-top:0;padding-top:0}
.nudge p{margin:0;font-size:14px}
.nudge blockquote{margin:0;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- canteiro: alto contraste fixo, para sol forte ---------- */
.fieldcol{display:grid;gap:10px;justify-items:center;position:sticky;top:16px}
@media (max-width:1280px){.fieldcol{position:static}}
.fieldcap{font-size:13px;color:var(--muted);text-align:center;max-width:360px;margin:0}
.phone{width:100%;max-width:380px;background:#0d0f0e;border-radius:38px;padding:12px;box-shadow:0 20px 40px -18px rgba(0,0,0,.45)}
@media (max-width:520px){.phone{padding:0;background:transparent;box-shadow:none;border-radius:0;max-width:none}}
.screen{--fy:#ffd21f;--fk:#0b0b0b;--fw:#ffffff;--fg:#f0f0ec;--fl:#cfcfc8;--fm:#4a4a46;--fr:#c21f14;--fgreen:#0f7a3a;
  background:var(--fw);color:var(--fk);border-radius:28px;min-height:700px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;font-size:17px;color-scheme:light}
@media (max-width:520px){.screen{border-radius:16px;border:2px solid var(--fk);min-height:620px}}
.fbar{background:var(--fk);color:var(--fw);padding:14px 16px 12px;display:grid;gap:10px}
.fbar .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fbar .t b{font-family:var(--f-display);font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.fbar .t span{font-family:var(--f-mono);font-size:12px;color:var(--fy);text-align:right}
.obrasel{display:flex;gap:6px;overflow-x:auto}
.obrasel button{flex:none;border:2px solid #3a3a37;background:transparent;color:var(--fw);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px}
.obrasel button[aria-pressed="true"]{background:var(--fy);color:var(--fk);border-color:var(--fy)}
.fbody{padding:16px;display:grid;gap:14px;align-content:start}
.fhead{display:grid;gap:2px}
.fhead small{font-family:var(--f-mono);font-size:12px;color:var(--fm);letter-spacing:.06em;text-transform:uppercase}
.fhead b{font-family:var(--f-display);font-size:26px;font-weight:900;line-height:1.05}
.fhead span{font-size:15px;color:var(--fm)}
.mic{border:3px solid var(--fk);background:var(--fy);color:var(--fk);border-radius:22px;padding:22px 16px;display:grid;justify-items:center;gap:8px;font-family:var(--f-display);font-weight:900;font-size:22px;text-transform:uppercase;line-height:1.1}
.mic svg{width:54px;height:54px}
.mic small{font-family:var(--f-body);font-weight:500;font-size:14px;text-transform:none}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    const l={id:uid('l'),tipo,desc,valor:Math.round(valor),venc,origem,obra,ref,status:status||(i<0?'pago':'aberto')};lanc.push(l);return l;};
  // parcelas de clientes
  unidades.filter(u=>u.status==='vendido').forEach(u=>{const ob=obras.find(o=>o.id===u.obra);
    const past=[];for(let m=-2;m<=3;m++){const d=monthDay(m,u.dia);const l=add('receber',`Parcela · ${u.obra==='pitangueira'?u.label:'Apto '+u.label} · ${ob.curto}`,u.parcela,d,'parcela',u.obra,u.id);if(l&&di(d)<0)past.push(l);}
    past.slice(-u.atraso).forEach(l=>{if(u.atraso)l.status='aberto';});});

    add('receber',`Financiamento à produção · medição ${n} · ${obras.find(x=>x.id===o).curto}`,v,dt(d),'repasse',o));
  // folha CLT e diaristas
  obras.forEach(o=>{const clt=pessoas.filter(p=>p.obra===o.id&&p.vinculo==='CLT').reduce((s,p)=>s+p.valor,0)*1.8;

    const dia=pessoas.filter(p=>p.obra===o.id&&p.vinculo==='Diarista').reduce((s,p)=>s+p.valor,0)*5;
    const f=new Date(today);f.setDate(f.getDate()+((5-f.getDay()+7)%7)-35);

  // medições de empreiteiras
  empreiteiras.forEach((e,i)=>{for(let m=-1;m<=3;m++){if(e.id==='e3'&&m>1)continue;add('pagar',`Medição · ${e.nome} · ${obras.find(o=>o.id===e.obra).curto}`,e.contrato*(e.id==='e1'?.075:.06),bizDay(monthDay(m,18+i*3)),'medicao',e.obra,e.id);}});

  for(let m=-1;m<=3;m++){

    add('pagar','Contabilidade',6500,bizDay(monthDay(m,15)),'fixo');
    add('pagar','Impostos (RET) do mês',31000,bizDay(monthDay(m,20)),'imposto');
    add('pagar',`Terreno Lote 7, Rio Tavares · parcela ${6+m}/20`,85000,bizDay(monthDay(m,25)),'terreno');}
  // pagamentos de compras
  const pc={};compras.forEach(c=>{if(c.status==='solicitado')return;const v=c.item.startsWith('Elevadores')?36:c.status==='entregue'&&c.obra==='ipe'?-8:c.status==='entregue'?12:21+(c.valor%5);
    const l=add('pagar',`${c.item} · ${c.fornecedor}`,c.valor,v<0?dt(v):bizDay(dt(v)),'compra',c.obra,c.id);if(l)pc[c.id]=l.id;});
  // materiais com entrega programada (concreto, aço, insumos)
  [['garapuvu',140000,27],['ipe',90000,24],['pitangueira',60000,22]].forEach(([o,v,d])=>{const ob=obras.find(x=>x.id===o);
    for(let m=-1;m<=3;m++)add('pagar',`Materiais programados · ${ob.curto}`,v,bizDay(monthDay(m,d)),'compra',o);});
  return {obras,estoque,unidades,pessoas,empreiteiras,compras,lanc,caixa:742000,reserva:400000};
}

function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function cashChart(id,h){
  const P=projecao();const W=760,H=h||260,L=70,R=16,T=16,B=28;
  const vals=P.map(p=>p.s).concat([S.d.reserva]);const lo=Math.min(0,...vals),hi=Math.max(...vals)*1.08;
  const step=niceStep(hi-lo);const y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;
  const X=i=>L+i/90*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g='';for(let v=y0;v<=y1+1;v+=step)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v===0?'0':mi(v).replace('R$ ','')}</text>`;
  for(let i=0;i<=90;i+=15)g+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===90?'end':'middle'}">${i===0?'hoje':fdate(dt(i))}</text>`;
  const line=P.map((p,i)=>`${i?'L':'M'}${X(p.i).toFixed(1)},${Y(p.s).toFixed(1)}`).join('');
  const area=line+`L${X(90)},${Y(Math.max(y0,0))}L${X(0)},${Y(Math.max(y0,0))}Z`;
  const min=P.reduce((m,x)=>x.s<m.s?x:m,P[0]);const mx=X(min.i),my=Y(min.s);
  const lblAnchor=min.i>70?'end':min.i<15?'start':'middle';
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo de caixa previsto para os próximos 90 dias. Menor saldo ${mi(min.s)} em ${fdate(dt(min.i))}.">
    ${g}<path class="area" d="${area}"/><line class="res" x1="${L}" x2="${W-R}" y1="${Y(S.d.reserva)}" y2="${Y(S.d.reserva)}"/>
    <text class="reslbl" x="${L+8}" y="${Y(S.d.reserva)+15}" text-anchor="start">reserva mínima ${mi(S.d.reserva)}</text>
    <path class="ln" d="${line}"/><circle class="minpt" cx="${mx}" cy="${my}" r="5"/>
    <text class="minlbl" x="${mx}" y="${my+20}" text-anchor="${lblAnchor}">menor saldo: ${mi(min.s)} em ${fdate(dt(min.i))}</text>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}"/><circle class="hpt" r="5" cx="0" cy="0"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" data-hit="1"/></svg>`;
  return `<div class="chart" id="${id}" data-w="${W}" data-l="${L}" data-r="${R}">${svg}<div class="tip"></div></div>`;
}
function bindChart(id){
  const el=document.getElementById(id);if(!el)return;const svg=el.querySelector('svg'),tip=el.querySelector('.tip');const P=projecao();
  const W=+el.dataset.w,L=+el.dataset.l,R=+el.dataset.r;const vb=svg.viewBox.baseVal;
  const H=vb.height,T=16,B=28;const vals=P.map(p=>p.s).concat([S.d.reserva]);const lo=Math.min(0,...vals),hi=Math.max(...vals)*1.08;
  const step=niceStep(hi-lo),y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;
  const X=i=>L+i/90*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const show=cx=>{const r=svg.getBoundingClientRect();const sx=(cx-r.left)/r.width*W;const i=clamp(Math.round((sx-L)/(W-L-R)*90),0,90);const p=P[i];
    el.classList.add('on');el.querySelector('.cross').setAttribute('x1',X(i));el.querySelector('.cross').setAttribute('x2',X(i));
    const h=el.querySelector('.hpt');h.setAttribute('cx',X(i));h.setAttribute('cy',Y(p.s));
    const evs=p.ev.slice().sort((a,b)=>b.valor-a.valor).slice(0,3).map(l=>`${l.tipo==='receber'?'+':'−'} ${mi(l.valor)} ${esc(clip(l.desc,34))}`).join('<br>');
    tip.innerHTML=`${i===0?'Hoje':fdl(dt(i))}<br><b>${mi(p.s)}</b>${evs?'<br>'+evs:''}`;
    const px=X(i)/W*r.width,py=Y(p.s)/H*r.height;tip.style.left=clamp(px,110,r.width-110)+'px';tip.style.top=py+'px';};
  svg.addEventListener('pointermove',e=>show(e.clientX));svg.addEventListener('pointerdown',e=>show(e.clientX));
  svg.addEventListener('pointerleave',()=>el.classList.remove('on'));
}

const ETAPA_KEYS=[['fund','Fundação'],['estrut','Estrutura'],['laje','Estrutura'],['pilar','Estrutura'],['alvenar','Alvenaria'],['instala','Instalações'],['elétric','Instalações'],['hidrául','Instalações'],['reboc','Reboco'],['acabament','Acabamento'],['pintur','Acabamento'],['piso','Acabamento'],['revestim','Acabamento'],['entrega','Entrega']];
function localParse(text,o){
  const t=text.toLowerCase();const r={etapa:null,avanco:null,estimado:false,equipe:null,clima:null,pendencias:[],gasto:null};
  for(const [k,n] of ETAPA_KEYS)if(t.includes(k)){r.etapa=n;break;}
  const p=t.match(/(\d{1,3})\s*%/);
  if(p&&r.etapa)r.avanco=clamp(+p[1],0,100);
  else if(r.etapa&&/conclu|termin|fechad|finaliz/.test(t)){const an=t.match(/(\d+)\s*[ºo°]?\s*(andar|pavimento)/);if(an&&o.pav){r.avanco=clamp(Math.round(+an[1]/o.pav*100),0,100);r.estimado=true;}else r.avanco=100;}
  let eq=0;for(const m of t.matchAll(/(\d+)\s*(pedreiros?|serventes?|funcion\w*|pessoas|homens|operári\w*|trabalhadores|eletricistas?|encanadores?)/g))eq+=+m[1];if(eq)r.equipe=eq;
  r.clima=/chov|chuva/.test(t)?'chuva':/nublad/.test(t)?'nublado':/\bsol\b|ensolarad/.test(t)?'sol':null;
  for(const m of text.matchAll(/falt(?:ou|a|ando)\s+([^,.;]+)/gi))r.pendencias.push('Falta de '+m[1].trim().replace(/^de\s+/i,''));
  for(const m of text.matchAll(/aguardando\s+([^,.;]+)/gi))r.pendencias.push('Aguardando '+m[1].trim());
  if(/parad/.test(t)&&r.clima==='chuva')r.pendencias.push('Obra parada por chuva');
  const g=text.match(/r\$\s*([\d.]+(?:,\d{1,2})?)/i)||text.match(/([\d.]+(?:,\d{1,2})?)\s*reais/i);
  if(g){const desc=(text.match(/(?:comprei|compramos|paguei|pagamos|gastei|gastamos)\s+([^,.;]+)/i)||[])[1];r.gasto={valor:num(g[1]),descricao:desc?desc.trim():'Gasto lançado no canteiro'};}
  return r;
}

function pay(id){
  const l=S.d.lanc.find(x=>x.id===id);if(!l||l.status!=='aberto')return;l.status='pago';
  if(l.tipo==='pagar'){S.d.caixa-=l.valor;if(l.obra&&!['parcela','repasse'].includes(l.origem)){const o=obraById(l.obra);if(o)o.realizado+=l.valor;}}
  else S.d.caixa+=l.valor;
  toast(`${l.tipo==='pagar'?'Pago':'Recebido'}: ${brl(l.valor)}. Saldo agora ${mi(S.d.caixa)}.`);render();
}

/* ============ Vendas ============ */
function vVendas(){
  const V=S.ven;const o=obraById(V.obra);const U=S.d.unidades.filter(u=>u.obra===o.id);
  const vgv=U.reduce((s,u)=>s+u.preco,0),vend=U.filter(u=>u.status==='vendido');
  const at=atrasadas().filter(l=>l.obra===o.id);const lateUnits=new Set(at.map(l=>l.ref));
  const floors=[...new Set(U.map(u=>u.andar))].sort((a,b)=>b-a);const n=Math.max(...floors.map(f=>U.filter(u=>u.andar===f).length));
  const grid=floors.map(f=>`<div class="floor" style="--n:${n}"><span>${f?f+'º':'Casas'}</span>${U.filter(u=>u.andar===f).map(u=>`<button class="u ${lateUnits.has(u.id)?'late':''}" data-st="${u.status}" data-act="unit" data-id="${u.id}" aria-pressed="${V.unit===u.id}" aria-label="${esc(u.label)}, ${u.status}${lateUnits.has(u.id)?', parcela atrasada':''}"><b>${esc(u.label.replace('Casa ','C'))}</b><small>${u.status==='vendido'?esc(u.comprador.split(' ')[0]):u.status==='reservado'?'reservada':mi(u.preco)}</small></button>`).join('')}</div>`).join('');
  const u=U.find(x=>x.id===V.unit);
  return `<div class="ph"><div><h1>Vendas</h1><p>Toque numa unidade para ver comprador, parcelas e ações.</p></div>
    <div class="chips">${S.d.obras.map(x=>`<button class="chip" data-act="vobra" data-id="${x.id}" aria-pressed="${x.id===o.id}">${esc(x.curto)}</button>`).join('')}</div></div>
  <div class="kpis k2">
    <div class="kpi"><span>Vendido · ${esc(o.nome)}</span><b>${Math.round(vend.reduce((s,x)=>s+x.preco,0)/vgv*100)}% do VGV</b><small>${vend.length} de ${U.length} unidades</small></div>
    <div class="kpi ${at.length?'warn':''}"><span>Parcelas atrasadas</span><b>${at.length}</b><small>${at.length?mi(sum(at))+' · marcadas em vermelho':'nenhuma'}</small></div>
  </div>
  <div class="grid2">
    <div class="box"><div class="espelho">${grid}</div>
      <div class="legend"><span><i class="sw s-v"></i>Vendida</span><span><i class="sw s-r"></i>Reservada</span><span><i class="sw" style="border:1px dashed var(--muted)"></i>Disponível</span><span><i class="sw" style="background:var(--red)"></i>Parcela atrasada</span></div>
      ${det('ven-mais','Mais números do empreendimento',`<div class="kv"><span>VGV total</span><strong>${mi(vgv)}</strong></div><div class="kv"><span>Em estoque</span><strong>${U.filter(x=>x.status!=='vendido').length} unidades</strong></div><div class="kv"><span>A receber de clientes em 90 dias</span><strong>${mi(sum(S.d.lanc.filter(l=>l.tipo==='receber'&&l.obra===o.id&&l.status==='aberto'&&di(l.venc)>=0&&di(l.venc)<=90&&l.origem!=='repasse')))}</strong></div>`,'flat')}</div>
    <div class="box ubox ${u?'has':''}">${u?unitDetail(u,o):'<h2>Unidade</h2><p class="empty">Toque numa unidade do espelho.</p>'}</div>
  </div>`;
}
function unitDetail(u,o){
  const name=u.obra==='pitangueira'?u.label:'Apto '+u.label;
  const st={vendido:['g','Vendida'],reservado:['y','Reservada'],disponivel:['','Disponível']}[u.status];
  const parc=S.d.lanc.filter(l=>l.ref===u.id).sort((a,b)=>a.venc-b.venc);const late=parc.filter(l=>l.status==='aberto'&&di(l.venc)<0);
  let act='';
  if(u.status==='disponivel')act=`<div class="inrow"><input id="ures" placeholder="Nome do interessado" aria-label="Nome do interessado"><button class="primary" data-act="reserve" data-id="${u.id}">Reservar</button></div>`;
  else if(u.status==='reservado')act=`<div class="btnrow"><button class="primary" data-act="sell" data-id="${u.id}">Fechar venda</button><button class="ghost" data-act="unreserve" data-id="${u.id}">Cancelar reserva</button></div><p class="note">Ao fechar, a entrada (20%) e as parcelas entram no Financeiro.</p>`;
  const cob=late.length?`Olá ${u.comprador.split(' ')[0]}, tudo bem? Consta em aberto ${late.length===1?'a parcela':'as parcelas'} de ${late.map(l=>fdate(l.venc)).join(' e ')} (${brl(sum(late))}) do ${name} no ${o.nome}. Podemos enviar a 2ª via?`:'';
  return `<div class="udet"><div class="boxhead"><h3>${esc(name)}</h3><span class="btnrow"><span class="pill ${st[0]}">${st[1]}</span><button class="ghost uclose" data-act="uclose">Fechar</button></span></div>
    <dl><dt>${esc(u.tipo)}</dt><dd>${u.area} m² · ${brl(u.preco)}</dd>${u.comprador?`<dt>${u.status==='vendido'?'Comprador':'Interessado'}</dt><dd>${esc(u.comprador)}</dd>`:''}</dl>
    ${act}
    ${late.length?`<p class="warnline"><i class="dot r"></i><b>${late.length} ${plural(late.length,'parcela atrasada','parcelas atrasadas')}</b> · ${brl(sum(late))}</p>${det('cob-'+u.id,'Ver mensagem de cobrança',`<blockquote id="cob" class="quote">${esc(cob)}</blockquote><div class="btnrow"><button class="primary" data-act="copy" data-el="cob">Copiar cobrança</button></div>`,'flat')}`:''}
    ${parc.length?det('par-'+u.id,`Ver parcelas (${parc.length}) · ${brl(u.parcela)} por mês`,`<div class="tw"><table><tbody>${parc.map(l=>`<tr><td>${fdate(l.venc)}</td><td>${ORIG[l.origem]}</td><td class="r">${brl(l.valor)}</td><td class="r">${l.status==='pago'?'<span class="pill g">Pago</span>':di(l.venc)<0?'<span class="pill r">Atrasada</span>':'<span class="pill">Aberta</span>'}</td></tr>`).join('')}</tbody></table></div>`,'flat'):''}
  </div>`;
}
function sell(u){
  const o=obraById(u.obra);const name=u.obra==='pitangueira'?u.label:'Apto '+u.label;
  u.status='vendido';u.parcela=Math.round(u.preco*0.3/36/100)*100;u.dia=10;
  S.d.lanc.push({id:uid('l'),tipo:'receber',desc:`Entrada · ${name} · ${o.curto}`,valor:Math.round(u.preco*.2),venc:dt(5),origem:'entrada',obra:o.id,ref:u.id,status:'aberto'});
  for(let m=1;m<=3;m++){const d=monthDay(m,10);if(di(d)<=95)S.d.lanc.push({id:uid('l'),tipo:'receber',desc:`Parcela · ${name} · ${o.curto}`,valor:u.parcela,venc:d,origem:'parcela',obra:o.id,ref:u.id,status:'aberto'});}
  toast(`Venda do ${name} fechada. Entrada de ${mi(u.preco*.2)} e parcelas lançadas no Financeiro.`);render();
}

/* ============ Compras ============ */
function vCompras(){
  const C=S.com;const tab=C.tab||'aprovar';
  const sol=S.d.compras.filter(c=>c.status==='solicitado'),apr=S.d.compras.filter(c=>c.status==='aprovado');const low=lowStock();
  const list=tab==='aprovar'?sol:tab==='caminho'?apr:S.d.compras;
  const stl={solicitado:['y','Para aprovar'],aprovado:['o','A caminho'],entregue:['g','Entregue']};
  const rows=list.map(c=>{const o=obraById(c.obra);const s=stl[c.status];
    const act=c.status==='solicitado'?`<button class="primary" data-act="approve" data-id="${c.id}">Aprovar</button>`:c.status==='aprovado'?`<button class="ghost" data-act="deliver" data-id="${c.id}">Recebido na obra</button>`:`<span class="pill ${s[0]}">${s[1]}</span>`;
    return `<tr><td>${esc(c.item)}<span class="sub">${esc(o.curto)} · ${c.qtd.toLocaleString('pt-BR')} ${esc(c.un)}${c.origem==='canteiro'?' · pedido do canteiro':''}</span></td><td class="r">${brl(c.valor)}</td><td class="r">${act}</td></tr>`;}).join('');
  const lowRows=low.map(e=>{const o=obraById(e.obra);const it=estItem(e);const pend=S.d.compras.some(c=>c.obra===o.id&&c.k===e.k&&c.status!=='entregue');
    return `<tr><td>${esc(it[0])}<span class="sub">${esc(o.curto)} · tem ${e.qtd.toLocaleString('pt-BR')}, mínimo ${e.min.toLocaleString('pt-BR')} ${esc(it[1])}</span></td><td class="r">${pend?'<span class="pill o">Pedido feito</span>':`<button class="ghost" data-act="order" data-o="${o.id}" data-k="${e.k}">Pedir</button>`}</td></tr>`;}).join('');
  const full=S.d.obras.map(o=>`<div class="stockbox"><h3>${esc(o.nome)}</h3>${S.d.estoque.filter(e=>e.obra===o.id).map(e=>{const it=estItem(e);const lw=e.qtd<e.min;
    return `<div class="stock"><div style="display:grid;gap:4px;min-width:0"><div class="kv"><span><strong>${esc(it[0])}</strong></span><span class="num">${e.qtd.toLocaleString('pt-BR')} ${esc(it[1])}</span></div><div class="prog"><i class="${lw?'low':''}" style="width:${clamp(e.qtd/(e.min*2)*100,2,100)}%"></i></div></div><span class="pill ${lw?'r':'g'}">${lw?'Baixo':'OK'}</span></div>`;}).join('')}</div>`).join('');
  return `<div class="ph"><div><h1>Compras</h1><p>Aprovar um pedido gera a conta a pagar; marcar como recebido soma ao estoque da obra.</p></div></div>
  <div class="box"><div class="chips" role="tablist">
      <button class="chip" role="tab" data-act="comtab" data-t="aprovar" aria-pressed="${tab==='aprovar'}">Para aprovar (${sol.length})</button>
      <button class="chip" role="tab" data-act="comtab" data-t="caminho" aria-pressed="${tab==='caminho'}">A caminho (${apr.length})</button>
      <button class="chip" role="tab" data-act="comtab" data-t="todos" aria-pressed="${tab==='todos'}">Todos</button></div>
    ${rows?`<div class="tw"><table><tbody>${rows}</tbody></table></div>`:`<p class="empty">${tab==='aprovar'?'Nada para aprovar.':'Nenhum pedido aqui.'}</p>`}</div>
  <div class="box"><h2>Material abaixo do mínimo (${low.length})</h2>${low.length?`<div class="tw"><table><tbody>${lowRows}</tbody></table></div>`:'<p class="empty">Estoque em dia nas três obras.</p>'}
    ${det('estoque-full','Ver estoque completo das obras',`<div class="stockgrid">${full}</div>`,'flat')}</div>`;
}
function approve(c){
  c.status='aprovado';const venc=bizDay(dt(28));
  S.d.lanc.push({id:uid('l'),tipo:'pagar',desc:`${c.item} · ${c.fornecedor}`,valor:c.valor,venc,origem:'compra',obra:c.obra,ref:c.id,status:'aberto'});
  toast(`Pedido aprovado. Conta a pagar de ${brl(c.valor)} lançada para ${fdate(venc)} no Financeiro.`);render();
}
function deliver(c){
  c.status='entregue';const e=S.d.estoque.find(x=>x.obra===c.obra&&x.k===c.k);if(e)e.qtd+=c.qtd;
  toast(e?`${c.item} recebido. Estoque da obra agora: ${e.qtd.toLocaleString('pt-BR')} ${ITENS[c.k][1]}.`:`${c.item} recebido na obra.`);render();
}

/* ============ Pessoas ============ */
function vPessoas(){
  const team=S.d.pessoas;const prox=S.d.lanc.filter(l=>['folha','diaria','medicao'].includes(l.origem)&&l.status==='aberto'&&di(l.venc)<=30).sort((a,b)=>a.venc-b.venc);
  const byObra=S.d.obras.map(o=>{const t=team.filter(p=>p.obra===o.id);const folha=t.filter(p=>p.vinculo==='CLT').reduce((s,p)=>s+p.valor,0)*1.8;
    const rows=t.map(p=>`<tr><td>${esc(p.nome)}<span class="sub">${esc(p.funcao)} · ${p.vinculo}</span></td><td class="r">${brl(p.valor)}<span class="sub">${p.vinculo==='CLT'?'por mês':'por dia'}</span></td></tr>`).join('');
    const emps=S.d.empreiteiras.filter(e=>e.obra===o.id).map(e=>{const pct=e.medido/e.contrato*100;const sug=Math.round(e.contrato*.06/1000)*1000;
      return `<div class="emp"><div class="boxhead"><h3>${esc(e.nome)}</h3><span class="note">${esc(e.servico)}</span></div>
        <div class="kv"><span>Medido ${Math.round(pct)}% de ${mi(e.contrato)}</span><strong>${mi(e.medido)}</strong></div><div class="prog"><i style="width:${pct}%"></i></div>
        ${S.med===e.id?`<div class="inrow"><input id="med-${e.id}" inputmode="numeric" value="${sug.toLocaleString('pt-BR')}" aria-label="Valor da medição de ${esc(e.nome)}"><button class="primary" data-act="medir" data-id="${e.id}">Confirmar</button><button class="ghost" data-act="medcancel">Cancelar</button></div><p class="note">Cria a conta a pagar no Financeiro, com vencimento em 10 dias.</p>`
          :`<button class="ghost" data-act="medopen" data-id="${e.id}">Lançar medição</button>`}</div>`;}).join('');
    return det('pes-'+o.id,`<span class="gd">${esc(o.nome)}</span><span class="gm">${t.length} pessoas · folha <b>${mi(folha)}</b>/mês</span>`,`<div class="tw"><table><tbody>${rows}</tbody></table></div>${emps?`<h4>Empreiteira</h4>${emps}`:''}`);}).join('');
  return `<div class="ph"><div><h1>Pessoas</h1><p>Toque numa obra para ver a equipe e lançar medições.</p></div></div>
  <div class="kpis k2">
    <div class="kpi"><span>Pessoas nas obras</span><b>${team.length}</b><small>${team.filter(p=>p.vinculo==='CLT').length} CLT · ${team.filter(p=>p.vinculo==='Diarista').length} diaristas</small></div>
    <div class="kpi"><span>Pagamentos de equipe em 30 dias</span><b>${mi(sum(prox))}</b><small>folha, diaristas e medições</small></div>
  </div>
  <div class="stack">${byObra}</div>
  ${det('pes-prox',`Próximos pagamentos de equipe (${prox.length})`,prox.length?`<div class="tw"><table><tbody>${prox.slice(0,12).map(l=>`<tr><td>${fdl(l.venc)}</td><td>${esc(l.desc)}</td><td class="r">${brl(l.valor)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nada nos próximos 30 dias.</p>')}`;
}
function medir(e){
  const el=$('#med-'+e.id);const v=el?num(el.value):0;if(!(v>0)){toast('Informe o valor da medição.');return;}
  e.medido=Math.min(e.contrato,e.medido+v);const o=obraById(e.obra);S.med=null;
  S.d.lanc.push({id:uid('l'),tipo:'pagar',desc:`Medição · ${e.nome} · ${o.curto}`,valor:Math.round(v),venc:dt(10),origem:'medicao',obra:e.obra,ref:e.id,status:'aberto'});
  toast(`Medição de ${brl(v)} da ${e.nome} lançada para ${fdate(dt(10))} no Financeiro.`);render();
}

/* ============ render ============ */
function render(){
  renderNav();const m=$('#main');
  const V={inicio:vInicio,obras:vObras,financeiro:vFinanceiro,vendas:vVendas,compras:vCompras,pessoas:vPessoas}[S.view];
  m.innerHTML=V();
  if(S.view==='inicio')bindChart('chHome');
  if(S.view==='financeiro')bindChart('chFin');
  if(S.view==='obras')renderField();
}
function copyFrom(id,btn){const el=document.getElementById(id);if(!el)return;const txt=el.textContent;
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copiada';},()=>selectEl(el));}catch(_){selectEl(el);}}
function selectEl(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}

document.addEventListener('toggle',e=>{const d=e.target;if(!d||d.tagName!=='DETAILS'||!d.dataset.k)return;if(d.open)OPEN.add(d.dataset.k);else OPEN.delete(d.dataset.k);saveOpen();},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,f=S.f;
  switch(a){
    case 'go':go(b.dataset.v);break;
    case 'reset':S.d=seed();S.dismissed={};S.sel=null;S.cob=null;S.med=null;S.ven.unit=null;Object.assign(S.f,{obra:'ipe',step:'idle',text:'',draft:null,toast:null});render();toast('Exemplo restaurado.');break;
    case 'alert':{const al=alertas()[+b.dataset.i];if(al)go(al.v,al.go);break;}
    case 'obra':go('obras',{sel:id});break;
    case 'sel':S.sel=S.sel===id?null:id;S.otab='and';refreshOffice();break;
    case 'otab':S.otab=b.dataset.t;refreshOffice();break;
    case 'cob':S.cob=S.cob===id?null:id;refreshOffice();break;
    case 'sub':S.sub=b.dataset.s;render();break;
    case 'copy':copyFrom(b.dataset.el,b);break;
    case 'dismiss':S.dismissed[id]=true;S.cob=null;refreshOffice();renderNav();break;
    case 'fobra':f.obra=id;f.toast=null;if(f.step==='confirm')f.step='typing';renderField();break;
    case 'fmic':f.step='typing';f.toast=null;renderField();break;
    case 'fq':f.step='typing';f.toast=null;f.text=['Hoje ','Comprei ','Choveu, ','Faltou '][+b.dataset.q];renderField();break;
    case 'fex':f.text=EXEMPLOS[+b.dataset.i];renderField();break;
    case 'fcancel':f.step='idle';f.text='';renderField();break;
    case 'fread':readText();break;
    case 'fedit':f.step='typing';f.draft=null;renderField();break;
    case 'fpct':{const i=$('#fpct');const v=(i.value===''?etapaAtual(fobra()).pct:num(i.value))+ +b.dataset.d;i.value=clamp(Math.round(v),0,100);break;}
    case 'faddp':readDraft();f.draft.pendencias.push('');renderField();{const ins=document.querySelectorAll('[data-pend]');if(ins.length)ins[ins.length-1].focus();}break;
    case 'fdelp':readDraft();f.draft.pendencias.splice(+b.dataset.i,1);renderField();break;
    case 'fok':confirmEntry();break;
    case 'fintab':S.fin.tab=b.dataset.t;render();break;
    case 'finrange':S.fin.range=b.dataset.r;render();break;
    case 'pay':pay(id);break;
    case 'vobra':S.ven.obra=id;S.ven.unit=null;render();break;
    case 'unit':S.ven.unit=S.ven.unit===id?null:id;render();break;
    case 'uclose':S.ven.unit=null;render();break;
    case 'reserve':{const u=S.d.unidades.find(x=>x.id===id);const n=($('#ures')||{}).value||'';if(!n.trim()){toast('Informe o nome do interessado.');break;}u.status='reservado';u.comprador=n.trim();toast(`Unidade reservada para ${n.trim()}.`);render();break;}
    case 'unreserve':{const u=S.d.unidades.find(x=>x.id===id);u.status='disponivel';u.comprador=null;toast('Reserva cancelada.');render();break;}
    case 'sell':sell(S.d.unidades.find(x=>x.id===id));break;
    case 'comtab':S.com.tab=b.dataset.t;render();break;
    case 'approve':approve(S.d.compras.find(x=>x.id===id));break;
    case 'deliver':deliver(S.d.compras.find(x=>x.id===id));break;
    case 'order':{const c=pedirMaterial(b.dataset.o,b.dataset.k,'escritório');if(c)toast(`Pedido criado: ${c.item}, ${c.qtd.toLocaleString('pt-BR')} ${c.un}. Está em "Para aprovar".`);render();break;}
    case 'medopen':S.med=id;render();{const i=$('#med-'+id);if(i)i.focus();}break;
    case 'medcancel':S.med=null;render();break;
    case 'medir':medir(S.d.empreiteiras.find(x=>x.id===id));break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='ftext'){S.f.text=e.target.value;const r=$('#fread');if(r)r.disabled=!S.f.text.trim();}});

render();
(async()=>{try{sample=await window.claude?.use?.('sample')||null;}catch(_){sample=null;}})();
})();
</script>
