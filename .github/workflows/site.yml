# Publica o painel de obras (painel/, build do Vite) no GitHub Pages a cada mudança na main,
# (endereço em Settings > Pages). O site institucional mora em outro
# repositório e é publicado de lá.
# Antes do primeiro uso: Settings > Pages > Source = "GitHub Actions".
name: Publicar painel

on:
  push:
    branches: [main]
    paths: ["painel/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - name: Testar e gerar o painel
        working-directory: painel
        env:
          # Banco na nuvem (sincronização entre aparelhos). Vazios = painel só no aparelho.
          # Settings > Secrets and variables > Actions > Variables. Guia: painel/docs/nuvem.md
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_CHAVE: ${{ vars.SUPABASE_CHAVE }}
          # Falha o build se faltar a URL ou a chave: sem elas o painel sairia SEM login.
          VITE_EXIGIR_LOGIN: "1"
        run: |
          npm ci
          npm run check
          npm run build
      - name: Montar a pasta publicada
        run: |
          mkdir _site
          cp -r painel/dist _site/painel
      - uses: actions/configure-pages@v5
        with:
          # Ativa o Pages (Source = GitHub Actions) sozinho na primeira vez
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
